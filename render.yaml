services:
  - type: web
    name: coin-ivl-wuqing
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # 数据库连接串在 Render 面板 Environment 中手动填写 (Supabase Session pooler 地址)
      - key: DATABASE_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: coin-vq-db
    plan: free
    databaseName: coin_vq
    ipAllowList: []
