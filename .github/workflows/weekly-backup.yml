name: 每周自动备份

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00 = 北京时间周一早8点
  workflow_dispatch: {}    # 支持在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 检查必需Secrets
        run: |
          set -x
          missing=""
          [ -z "${{ secrets.SITE_URL }}" ] && missing="$missing SITE_URL"
          [ -z "${{ secrets.BACKUP_TOKEN }}" ] && missing="$missing BACKUP_TOKEN"
          [ -z "${{ secrets.BACKUP_PAT }}" ] && missing="$missing BACKUP_PAT"
          [ -n "$missing" ] && { echo "缺少Secrets:$missing - 请到 Settings → Secrets and variables → Actions 添加"; exit 1; }
          echo "Secrets已配置"

      - name: 拉取备份数据
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -x
          curl -sS --retry 4 --retry-delay 30 --max-time 300 \
            -H "X-Backup-Token: ${BACKUP_TOKEN}" \
            "${SITE_URL}/api/admin/export" -o backup.json
          grep -q '"version"' backup.json || { echo "备份内容异常:"; head -c 300 backup.json; exit 1; }
          echo "备份大小: $(wc -c < backup.json) 字节"
          echo "BACKUP_SIZE=$(wc -c < backup.json)" >> $GITHUB_ENV

      - name: 推送到备份仓库
        env:
          PAT: ${{ secrets.BACKUP_PAT }}
        run: |
          set -x
          DATE=$(date -u +%Y-%m-%d)
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/WuQing1517/betting-backup.git" repo
          cd repo
          mkdir -p backups
          cp ../backup.json "backups/backup_${DATE}.json"
          ls -t backups/backup_*.json 2>/dev/null | tail -n +13 | xargs -r git rm -q
          git config user.name "backup-bot"
          git config user.email "actions@github.com"
          git add backups
          git commit -m "自动备份 ${DATE}" || echo "内容无变化，跳过提交"
          git push

      - name: 同步到PythonAnywhere备站
        env:
          PA_URL: ${{ secrets.PA_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -x
          if [ -z "$PA_URL" ]; then echo "未配置PA_URL, 跳过备站同步"; echo "PA_SYNC=skipped" >> $GITHUB_ENV; exit 0; fi
          RESP=$(curl -sS --retry 3 --retry-delay 30 --max-time 600 \
            -X POST -H "Content-Type: application/json" -H "X-Backup-Token: ${BACKUP_TOKEN}" \
            --data-binary @backup.json "${PA_URL}/api/admin/import")
          echo "$RESP" | head -c 300
          echo "$RESP" | grep -q '"message"' || { echo "备站同步失败"; echo "PA_SYNC=failed" >> $GITHUB_ENV; exit 1; }
          echo "备站同步成功"
          echo "PA_SYNC=ok" >> $GITHUB_ENV

      # 通知: 成败都发, 未配置的渠道自动跳过, 通知失败不影响备份结果
      - name: 微信通知
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          BACKUP_SIZE: ${{ env.BACKUP_SIZE }}
          PA_SYNC: ${{ env.PA_SYNC }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SIZE=${BACKUP_SIZE:-未知}
          if [ "$JOB_STATUS" = "success" ]; then
            case "$PA_SYNC" in
              ok)      TITLE="✅ 每周备份成功 ${DATE}"; STATUS_LINE="PA备站同步: 成功";;
              skipped) TITLE="⚠️ 每周备份完成(未同步PA) ${DATE}"; STATUS_LINE="PA备站同步: 跳过(未配置PA_URL)";;
              *)       TITLE="✅ 每周备份成功 ${DATE}"; STATUS_LINE="PA备站同步: ${PA_SYNC:-无}";;
            esac
            BODY=$(printf '备份文件: backup_%s.json (%s 字节)\n%s\n仓库: https://github.com/WuQing1517/betting-backup' "$DATE" "$SIZE" "$STATUS_LINE")
          else
            TITLE="❌ 每周备份失败 ${DATE}"
            STATUS_LINE="本次备份未完成, 请尽快查看日志"
            BODY=$(printf '%s\n日志: https://github.com/WuQing1517/betting-system/actions' "$STATUS_LINE")
          fi
          echo "MAIL_TITLE=$TITLE" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$STATUS_LINE" "$BODY" > mail_body.txt
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            RESP=$(curl -sS --max-time 30 "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
              --data-urlencode "title=${TITLE}" --data-urlencode "desp=${BODY}")
            echo "Server酱响应: ${RESP:0:150}"
          fi
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            RESP=$(curl -sS -G --max-time 30 "https://www.pushplus.plus/send" \
              --data-urlencode "token=${PUSHPLUS_TOKEN}" --data-urlencode "title=${TITLE}" \
              --data-urlencode "content=${BODY}" --data-urlencode "template=txt")
            echo "PushPlus响应: ${RESP:0:150}"
          fi
          if [ -z "$SERVERCHAN_SENDKEY" ] && [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "未配置微信推送Secret(SERVERCHAN_SENDKEY 或 PUSHPLUS_TOKEN), 跳过微信通知"
          fi

      - name: 邮件通知
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.MAIL_TITLE }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          body: file://mail_body.txt
